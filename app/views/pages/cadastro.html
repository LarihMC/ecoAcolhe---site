<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <main>
        <header>
            <a href="index.html">← Voltar</a>
        </header> 

        <section class="titulo">
            <h1>Cadastre-se</h1>
            <img src="../../public/imagem/ecoacolhe logotipo bg transparente.png" alt="Logo Eco Acolhe">
        </section>

        <section class="formulario">
            <form>
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" required>

                <label for="dataNasc">Data de nascimento</label>
                <input type="date" id="dataNasc" name="dataNasc" required>

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" required>

                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco" required>

                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>

                <label for="confirmarSenha">Confirmar senha</label>
                <input type="password" id="confirmarSenha" name="confirmarSenha" required>

                <input type="checkbox" id="consentimento" name="consentimento" required>
                <label for="consentimento">Aceito os termos de consentimento</label>

                <input type="checkbox" id="privacidade" name="privacidade" required>
                <label for="privacidade">Aceito os termos de privacidade</label>

                <a href="termos.html">Leia os termos de consentimento e privacidade</a>

                <button type="submit">Entrar</button>

            </form>
        </section>
               <a href="login.html">Já tem uma conta? Faça login</a>
    </main>
 
</body>
</html>
